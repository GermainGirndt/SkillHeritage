<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP4 Progressive Streaming</title>
    <style>
      body {
        background: #0e0e0e;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin-bottom: 20px;
      }

      video {
        width: 100%;
        max-width: 800px;
        border: 2px solid #444;
        border-radius: 8px;
        background: black;
      }

      .info {
        margin-top: 20px;
        padding: 10px;
        background: #222;
        border: 1px solid #444;
        border-radius: 6px;
        max-width: 800px;
        font-size: 14px;
        line-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>MP4 Progressive Streaming Player</h1>

    <video controls autoplay>
      <!-- Replace with your NestJS endpoint -->
      <source src="http://localhost:3000/video/stream" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>

    <div class="info">
      <strong>How this works:</strong><br />
      • The browser automatically sends <code>Range</code> requests.<br />
      • The NestJS server returns only the needed byte ranges.<br />
      • The user can seek instantly and playback starts quickly.<br /><br />
      Works on all major browsers.
    </div>
  </body>
</html>
